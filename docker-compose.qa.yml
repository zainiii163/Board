# Isolated QA database — never points at production.
# Usage: docker compose -f docker-compose.qa.yml up -d
# Then set backend/.env.qa DATABASE_URL=postgresql://postgres:postgres@localhost:5434/boardnotes_qa
services:
  db-qa:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: boardnotes_qa
    ports:
      - "5434:5432"
    volumes:
      - pgdata_qa:/var/lib/postgresql/data
volumes:
  pgdata_qa:
